<title>Kadr i Opis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=JetBrains+Mono:wght@400;600&family=Source+Serif+4:opsz,wght@8..60,400..600&display=swap">
<style>
:root {
  --bg: #E7EAED;
  --surface: #FFFFFF;
  --surface-2: #F2F4F6;
  --ink: #14171B;
  --muted: #58606A;
  --line: #D1D6DC;
  --line-strong: #A9B1BA;
  --accent: #C4302B;
  --accent-ink: #FFFFFF;
  --accent-soft: #F8E4E2;
  --ok: #2D7649;
  --warn: #9A620F;
  --shadow: 0 1px 2px rgba(20, 23, 27, .06), 0 10px 28px -14px rgba(20, 23, 27, .22);
  --sans: "Archivo", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D0F11; --surface: #16191D; --surface-2: #1E2227; --ink: #E8EBEE; --muted: #9BA4AE;
    --line: #2B3138; --line-strong: #47505A; --accent: #FF5A4E; --accent-ink: #1B0908; --accent-soft: #3B1714;
    --ok: #5DC98B; --warn: #E3A844; --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 28px -14px rgba(0, 0, 0, .7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D0F11; --surface: #16191D; --surface-2: #1E2227; --ink: #E8EBEE; --muted: #9BA4AE;
  --line: #2B3138; --line-strong: #47505A; --accent: #FF5A4E; --accent-ink: #1B0908; --accent-soft: #3B1714;
  --ok: #5DC98B; --warn: #E3A844; --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 28px -14px rgba(0, 0, 0, .7);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); }
html.app { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; color: var(--ink); font: 400 15px/1.5 var(--sans); padding-inline: 16px; padding-block: 0 48px; -webkit-font-smoothing: antialiased; }
img { max-width: 100%; }
a { color: inherit; }
.app-wrap { max-width: 1320px; margin: 0 auto; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.vh { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.mono { font-family: var(--mono); }
.note { font-size: 13px; color: var(--muted); margin: 0; }

/* Nagłówek */
.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; padding-block: 20px 0; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
.brand { display: flex; align-items: center; gap: 14px; padding-bottom: 14px; min-width: 0; }
.mark { --c: var(--ink); width: 36px; height: 36px; flex: none; background:
  linear-gradient(var(--c), var(--c)) 0 0 / 12px 2px no-repeat, linear-gradient(var(--c), var(--c)) 0 0 / 2px 12px no-repeat,
  linear-gradient(var(--c), var(--c)) 100% 0 / 12px 2px no-repeat, linear-gradient(var(--c), var(--c)) 100% 0 / 2px 12px no-repeat,
  linear-gradient(var(--c), var(--c)) 0 100% / 12px 2px no-repeat, linear-gradient(var(--c), var(--c)) 0 100% / 2px 12px no-repeat,
  linear-gradient(var(--c), var(--c)) 100% 100% / 12px 2px no-repeat, linear-gradient(var(--c), var(--c)) 100% 100% / 2px 12px no-repeat,
  radial-gradient(circle, var(--accent) 0 5px, transparent 5.5px) center / 100% 100% no-repeat; }
h1 { font: 800 27px/1 var(--sans); font-stretch: 70%; letter-spacing: .03em; text-transform: uppercase; margin: 0; }
.tag { margin: 5px 0 0; color: var(--muted); font-size: 13.5px; }
.top-right { display: flex; align-items: flex-end; gap: 10px; flex-wrap: wrap; max-width: 100%; }
.top-right .btn { margin-bottom: 8px; }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; max-width: 100%; }
.tabs button { font: 600 14px/1 var(--sans); padding: 12px 14px; border: 0; background: none; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.tabs button:hover { color: var(--ink); }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.count { font: 600 11px/1 var(--mono); background: var(--accent); color: var(--accent-ink); border-radius: 9px; padding: 3px 6px; }
.count:empty { display: none; }
.today { display: flex; gap: 10px 14px; align-items: center; flex-wrap: wrap; background: var(--accent-soft); color: var(--ink); border-radius: var(--r); padding: 11px 14px; margin-bottom: 16px; font-size: 14px; }
.today strong { color: var(--accent); }
.today .btn { margin-left: auto; }

/* Panele */
.studio { display: grid; gap: 16px; }
@media (min-width: 980px) { .studio { grid-template-columns: minmax(320px, 400px) minmax(0, 1fr); align-items: start; } }
.col { display: grid; gap: 16px; align-content: start; min-width: 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; box-shadow: var(--shadow); min-width: 0; }
.panel-h { display: flex; align-items: baseline; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.panel-h h2 { font: 700 15px/1.2 var(--sans); font-stretch: 78%; text-transform: uppercase; letter-spacing: .08em; margin: 0; }
.panel-h .aside { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.step { font: 600 12px/1 var(--mono); color: var(--accent); }
.hint { font-size: 12.5px; color: var(--muted); }

/* Zdjęcia */
.drop { position: relative; display: grid; place-items: center; gap: 4px; text-align: center; padding: 26px 16px; border: 1.5px dashed var(--line-strong); border-radius: var(--r); background: var(--surface-2); cursor: pointer; transition: border-color .15s, background-color .15s; }
.drop:hover, .drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.drop input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
.drop strong { font-size: 16px; }
.drop span { color: var(--muted); font-size: 13px; }
.strip { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 8px; margin-top: 12px; }
.thumb { position: relative; aspect-ratio: 1; border-radius: 4px; overflow: hidden; background: var(--surface-2); outline: 2px solid transparent; outline-offset: 1px; }
.thumb.active { outline-color: var(--accent); }
.thumb .sel { display: block; width: 100%; height: 100%; padding: 0; border: 0; background: none; cursor: pointer; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb .n { position: absolute; left: 4px; top: 4px; font: 600 11px/1 var(--mono); background: rgba(0, 0, 0, .62); color: #fff; padding: 3px 5px; border-radius: 3px; pointer-events: none; }
.thumb .cov { position: absolute; left: 0; right: 0; bottom: 0; font: 600 10px/1 var(--mono); text-transform: uppercase; letter-spacing: .06em; background: var(--accent); color: var(--accent-ink); padding: 4px 0; text-align: center; pointer-events: none; }
.thumb .rm { position: absolute; right: 4px; top: 4px; width: 24px; height: 24px; border-radius: 50%; border: 0; background: rgba(0, 0, 0, .62); color: #fff; font: 600 15px/1 var(--sans); cursor: pointer; display: grid; place-items: center; }

/* Formularze */
.field { display: grid; gap: 6px; margin: 0 0 14px; border: 0; padding: 0; min-width: 0; }
.field > label, .field > legend, .lrow > label, .lrow > span { font-weight: 600; font-size: 13px; padding: 0; }
.field > legend { margin-bottom: 6px; }
.lrow { display: flex; align-items: center; gap: 8px; position: relative; }
input[type="text"], input[type="url"], input[type="number"], input[type="date"], input[type="time"], input[type="password"], select, textarea {
  width: 100%; max-width: 100%; font: inherit; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); border-radius: 4px; padding: 9px 10px; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
textarea { resize: vertical; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 500 13px/1.2 var(--sans); padding: 7px 11px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); cursor: pointer; }
.chip:hover { border-color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.chip:disabled { opacity: .5; cursor: not-allowed; }
.goal-hint { font-size: 13px; color: var(--muted); margin: 2px 0 0; min-height: 1.4em; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
@media (max-width: 640px) { .grid2 { grid-template-columns: 1fr; } }

/* Dymek z podpowiedzią */
.info-btn { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--line-strong); background: var(--surface); color: var(--muted); font: 700 12px/1 var(--serif); font-style: italic; cursor: pointer; display: inline-grid; place-items: center; padding: 0; }
.info-btn:hover, .info-btn[aria-expanded="true"] { border-color: var(--accent); color: var(--accent); }
.pop { position: absolute; z-index: 30; top: calc(100% + 8px); left: 0; width: min(380px, calc(100vw - 48px)); background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--r); box-shadow: 0 16px 40px -12px rgba(0, 0, 0, .35); padding: 14px 16px; font-size: 13.5px; font-weight: 400; display: grid; gap: 10px; }
.pop dl { margin: 0; display: grid; gap: 9px; }
.pop dt { font-weight: 700; }
.pop dd { margin: 2px 0 0; color: var(--muted); }
.pop dd b { color: var(--ink); font-weight: 600; }
.pop .mix { border-top: 1px solid var(--line); padding-top: 9px; color: var(--ink); }

/* Przyciski */
.btn { font: 600 14px/1.2 var(--sans); padding: 9px 14px; border-radius: 4px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; }
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.big { width: 100%; padding: 14px 16px; font-size: 15px; font-stretch: 88%; text-transform: uppercase; letter-spacing: .07em; }
.btn.sm { padding: 6px 10px; font-size: 13px; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--ink); border-color: var(--line); }
.btn:disabled { opacity: .5; cursor: not-allowed; filter: none; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 16px; }

/* Status */
.status { min-height: 1.5em; margin: 12px 0 0; font-size: 14px; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.status.err { color: var(--accent); }
.status.ok { color: var(--ok); }
.spin { width: 14px; height: 14px; border: 2px solid var(--line-strong); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Teksty */
.badge { font: 600 11px/1 var(--mono); text-transform: uppercase; letter-spacing: .08em; padding: 5px 7px; border-radius: 3px; background: var(--accent-soft); color: var(--accent); }
.analysis { background: var(--surface-2); border-radius: 4px; padding: 13px 15px; margin-bottom: 16px; font-size: 14px; display: grid; gap: 7px; }
.analysis p { margin: 0; }
.analysis ul { margin: 0; padding-left: 18px; display: grid; gap: 3px; }
.analysis .ex { color: var(--accent); font-weight: 600; }
.analysis details summary { cursor: pointer; font-weight: 600; }
.analysis .checks { list-style: none; padding: 6px 0 0; }
.analysis .checks label { display: flex; gap: 8px; align-items: flex-start; cursor: pointer; }
.analysis .checks input { margin-top: 3px; accent-color: var(--accent); }
.ptabs { display: flex; gap: 2px; flex-wrap: wrap; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
.ptabs button { font: 600 13.5px/1 var(--sans); padding: 10px 12px; border: 0; background: none; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; cursor: pointer; }
.ptabs button:hover { color: var(--ink); }
.ptabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.results.busy .pbody, .results.busy .analysis { opacity: .45; pointer-events: none; transition: opacity .2s; }
.fblock { margin-bottom: 16px; }
.fblock-h { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
.fblock-h label, .lbl { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.fblock-h .btn { margin-left: auto; }
.fblock-h .counter + .btn { margin-left: 0; }
.counter { font: 400 12px/1 var(--mono); color: var(--muted); margin-left: auto; font-variant-numeric: tabular-nums; }
.counter.warn { color: var(--warn); }
.counter.over { color: var(--accent); font-weight: 600; }
textarea.copytext { font: 400 16px/1.55 var(--serif); min-height: 2.8em; overflow-wrap: anywhere; }
textarea.copytext.short { font-size: 15px; }
.sub-h { font: 700 13px/1.2 var(--sans); text-transform: uppercase; letter-spacing: .07em; margin: 22px 0 12px; padding-top: 14px; border-top: 1px solid var(--line); }
.variants { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.tagchip { font: 500 13px/1 var(--mono); padding: 5px 6px 5px 9px; border-radius: 3px; background: var(--surface-2); border: 1px solid var(--line); display: inline-flex; gap: 4px; align-items: center; }
.tagchip button { border: 0; background: none; color: var(--muted); cursor: pointer; padding: 0 3px; font: 600 15px/1 var(--sans); }
.tagchip button:hover { color: var(--accent); }
.tagchip.kw { padding-right: 9px; font-family: var(--sans); }
.tags input { width: 150px; padding: 6px 8px; font: 400 13px/1 var(--mono); }
.info { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 7px 14px; font-size: 14px; margin: 0 0 16px; }
.info dt { color: var(--muted); }
.info dd { margin: 0; overflow-wrap: anywhere; }
.alts { display: grid; gap: 4px; }
.altrow { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 10px; align-items: start; }
.altrow img, .altrow .ph { width: 44px; height: 44px; object-fit: cover; border-radius: 3px; background: var(--surface-2); margin-top: 22px; }
.story + .story { border-top: 1px solid var(--line); padding-top: 12px; }
.refine { border-top: 1px solid var(--line); padding-top: 14px; margin-top: 4px; display: grid; gap: 9px; }
.refine-row { display: flex; gap: 8px; flex-wrap: wrap; }
.refine-row input { flex: 1 1 200px; min-width: 0; }

/* Kadry */
.crops { margin-top: 16px; }
.formats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px 16px; align-items: start; }
@media (min-width: 1000px) { .formats { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.fmt { display: grid; gap: 8px; min-width: 0; }
.frame { --m: var(--line-strong); position: relative; padding: 9px; background:
  linear-gradient(var(--m), var(--m)) 0 0 / 11px 1px no-repeat, linear-gradient(var(--m), var(--m)) 0 0 / 1px 11px no-repeat,
  linear-gradient(var(--m), var(--m)) 100% 0 / 11px 1px no-repeat, linear-gradient(var(--m), var(--m)) 100% 0 / 1px 11px no-repeat,
  linear-gradient(var(--m), var(--m)) 0 100% / 11px 1px no-repeat, linear-gradient(var(--m), var(--m)) 0 100% / 1px 11px no-repeat,
  linear-gradient(var(--m), var(--m)) 100% 100% / 11px 1px no-repeat, linear-gradient(var(--m), var(--m)) 100% 100% / 1px 11px no-repeat; }
.fmt.editing .frame { --m: var(--accent); }
.box { position: relative; aspect-ratio: var(--ar); width: 100%; max-width: 100%; background: var(--surface-2); overflow: hidden; display: grid; place-items: center; outline: 1px solid var(--line); }
.field > .seg { justify-self: start; }
.box canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: pan-y; }
.fmt.editing .box canvas { touch-action: none; }
.box .empty { font: 400 12px/1.4 var(--mono); color: var(--muted); text-align: center; padding: 8px; }
.fmt-h { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.fmt-h strong { font-size: 14px; }
.fmt-h .mono { font-size: 11.5px; color: var(--muted); white-space: nowrap; }
.fmt-note { font-size: 12.5px; color: var(--muted); margin: 0; }
.fmt-ctl { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.fmt-ctl .dl { width: 100%; }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 4px; overflow: hidden; }
.seg button { font: 600 12.5px/1 var(--sans); padding: 7px 10px; border: 0; background: var(--surface); color: var(--muted); cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line-strong); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.zoom { display: flex; align-items: center; gap: 8px; font: 400 12px/1 var(--mono); color: var(--muted); width: 100%; }
.zoom input { flex: 1; min-width: 0; accent-color: var(--accent); }

/* Plan */
.plan-sum { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; margin-bottom: 18px; }
.plan-sum .k { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; display: block; }
.plan-sum .v { font: 700 24px/1.1 var(--sans); font-stretch: 72%; font-variant-numeric: tabular-nums; }
.plan-sum .grow { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.meter { display: flex; gap: 4px; margin-top: 6px; flex-wrap: wrap; }
.meter i { width: 18px; height: 12px; border: 1.5px solid var(--line-strong); border-radius: 2px; }
.meter i.on { background: var(--accent); border-color: var(--accent); }
.plan-h { font: 700 14px/1.2 var(--sans); font-stretch: 78%; text-transform: uppercase; letter-spacing: .08em; margin: 20px 0 10px; }
.plist { display: grid; gap: 8px; }
.prow { display: grid; grid-template-columns: 60px minmax(0, 1fr) auto; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px; }
.prow img, .prow .ph { width: 60px; height: 60px; object-fit: cover; border-radius: 4px; background: var(--surface-2); display: block; }
.prow .t { font-weight: 600; overflow-wrap: anywhere; }
.prow .m { color: var(--muted); font-size: 13px; }
.prow .acts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; align-items: center; }
.prow .acts input[type="date"] { width: auto; padding: 6px 8px; font-size: 13px; }
.prow .donecb { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; cursor: pointer; }
.prow .donecb input { accent-color: var(--accent); }
.prow.done .t { text-decoration: line-through; text-decoration-color: var(--line-strong); }
.empty-plan { padding: 22px; text-align: center; color: var(--muted); border: 1.5px dashed var(--line-strong); border-radius: var(--r); }
@media (max-width: 600px) { .prow { grid-template-columns: 52px minmax(0, 1fr); } .prow img, .prow .ph { width: 52px; height: 52px; } .prow .acts { grid-column: 1 / -1; justify-content: flex-start; } }

/* Ustawienia */
.settings { max-width: 780px; display: grid; gap: 16px; }
.set-sec h3 { font: 700 14px/1.2 var(--sans); font-stretch: 78%; text-transform: uppercase; letter-spacing: .08em; margin: 0 0 14px; }
.days { display: flex; gap: 6px; flex-wrap: wrap; }
.keyrow { display: flex; gap: 8px; }
.keyrow input { flex: 1; min-width: 0; font-family: var(--mono); font-size: 13px; }
.help { font-size: 12.5px; color: var(--muted); margin: 0; }
.help a { color: var(--accent); }
.check { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; cursor: pointer; margin-bottom: 14px; }
.check input { margin-top: 3px; accent-color: var(--accent); }
.save-bar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }

/* Komunikaty */
.toast { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--surface); padding: 11px 16px; border-radius: 4px; font-size: 14px; box-shadow: var(--shadow); z-index: 50; max-width: calc(100% - 32px); width: max-content; }
.modal { position: fixed; inset: 0; background: rgba(0, 0, 0, .62); display: grid; place-items: center; padding: 16px; z-index: 60; }
.modal-card { background: var(--surface); border-radius: var(--r); padding: 18px; max-width: 760px; width: 100%; max-height: 92vh; overflow: auto; display: grid; gap: 12px; }
.save-imgs { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
