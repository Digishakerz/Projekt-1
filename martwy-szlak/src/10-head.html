<title>Martwy Szlak</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* Gra ma jeden, świadomie ciemny wygląd (noc na asfalcie), niezależny od motywu systemu. */
:root{
  color-scheme:dark;
  --bg:#15110d; --paper:#f3e6cf; --muted:#cdb99a; --rust:#b8471d; --amber:#f5b72e; --amber-d:#a06c0d;
  --squad:#2fb9e8; --blood:#c21d10; --chip:rgba(21,17,13,.76); --line:rgba(243,230,207,.2);
  --sign:#1f5fae; --sign-d:#10386a; --haz:#e8b81c; --haz-d:#1a1a1a; --ink:#2a1605;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;overscroll-behavior:none}
body{font-family:Rubik,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--paper);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#stage{position:relative;height:100%;max-width:100%;aspect-ratio:.56/1;margin:0 auto;overflow:hidden;touch-action:none;background:#2b2520}
canvas{display:block;width:100%;height:100%}
button{font:inherit;color:inherit}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}

/* ---------- HUD ---------- */
#hud{position:absolute;inset:0 0 auto 0;padding:10px 12px 0;pointer-events:none;display:flex;flex-direction:column;gap:7px}
#hud .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chip{display:flex;align-items:center;gap:7px;background:var(--chip);border:2px solid var(--line);border-radius:999px;padding:4px 12px;min-height:36px;font-weight:900;font-size:15px}
.chip.lvl{font-family:Bungee,Impact,sans-serif;font-weight:400;font-size:12px;letter-spacing:.04em;color:var(--muted)}
.chip.coins{font-variant-numeric:tabular-nums}
.coin{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6c2,#ffd23a 45%,#b07a06);box-shadow:inset 0 0 0 2px #8a5c03}
.chip.weapon{padding:3px 12px 3px 6px;font-family:Bungee,Impact,sans-serif;font-weight:400;font-size:12px;color:var(--amber)}
.chip.weapon img{height:26px;width:46px;object-fit:contain}
.icon{pointer-events:auto;cursor:pointer;background:var(--chip);border:2px solid var(--line);border-radius:12px;min-width:44px;min-height:40px;font-family:Bungee,Impact,sans-serif;font-size:14px}
#prog{height:7px;border-radius:6px;background:rgba(21,17,13,.6);overflow:hidden}
#prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#e0a25a,var(--amber));transition:width .4s}
#bossbar[hidden]{display:none}
#bossName{font-family:Bungee,Impact,sans-serif;font-size:17px;text-shadow:0 2px 0 #000;margin-bottom:3px;color:#ffd0c4}
#bossbar .bar{height:14px;border-radius:8px;background:rgba(21,17,13,.8);border:2px solid #000;overflow:hidden}
#bossHp{display:block;height:100%;width:100%;background:linear-gradient(180deg,#ff6a52,var(--blood));transition:width .15s}

/* ---------- Komunikaty ---------- */
#banner{position:absolute;left:0;right:0;top:34%;text-align:center;pointer-events:none;opacity:0;padding:0 16px}
#banner b{display:block;font-family:Bungee,Impact,sans-serif;font-size:clamp(26px,8.6vw,42px);font-weight:400;line-height:1.05;color:#fff;text-shadow:0 4px 0 var(--rust),0 8px 18px rgba(0,0,0,.55);text-wrap:balance}
#banner span{display:block;margin-top:8px;font-weight:700;font-size:16px;text-shadow:0 2px 4px #000}
#banner.show{animation:ban 2.4s ease-out forwards}
#banner.danger b{text-shadow:0 4px 0 #7d0c05,0 8px 18px rgba(0,0,0,.55);color:#ffe3dc}
@keyframes ban{0%{opacity:0;transform:scale(1.5)}12%{opacity:1;transform:scale(1)}78%{opacity:1}100%{opacity:0;transform:translateY(-18px)}}
@media (prefers-reduced-motion:reduce){#banner.show{animation:banr 2.4s linear forwards}@keyframes banr{0%,85%{opacity:1}100%{opacity:0}}}

/* ---------- Ekrany ---------- */
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;gap:12px;padding:24px 18px 26px;overflow-y:auto}
.overlay[hidden]{display:none}
#menu{background:#2a1a10 center top/cover no-repeat}
#menu::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(21,17,13,.5) 0%,rgba(21,17,13,0) 20%,rgba(21,17,13,0) 34%,rgba(21,17,13,.82) 52%,rgba(21,17,13,.97) 70%)}
#menu > *{position:relative}
.title{font-family:Bungee,Impact,sans-serif;font-weight:400;font-size:clamp(42px,13.5vw,64px);line-height:.92;margin:0;color:var(--paper);text-shadow:0 5px 0 var(--rust),0 10px 0 rgba(0,0,0,.35);text-wrap:balance}
#menu .title{position:absolute;top:26px;left:18px;right:18px;text-align:center}
.lede{font-size:15px;line-height:1.45;margin:0;color:var(--muted);max-width:40ch}
.lanes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:12.5px;line-height:1.3;color:var(--muted)}
.lanes div{background:rgba(243,230,207,.07);border:1px solid var(--line);border-radius:10px;padding:8px}
.lanes b{display:block;font-family:Bungee,Impact,sans-serif;font-weight:400;font-size:13px;color:#fff;margin-bottom:3px;letter-spacing:.03em}
/* Poziomy jak tablice drogowe: niebieska autostradowa i żółto-czarna ostrzegawcza. */
.sign{display:flex;align-items:center;gap:12px;width:100%;text-align:left;cursor:pointer;border-radius:12px;padding:10px 12px;border:3px solid #fff;box-shadow:0 5px 0 rgba(0,0,0,.45)}
.sign:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.45)}
.sign .badge{flex:none;font-family:Bungee,Impact,sans-serif;font-size:18px;padding:5px 9px;border-radius:7px;line-height:1}
.sign .txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.sign strong{font-family:Bungee,Impact,sans-serif;font-weight:400;font-size:18px;line-height:1.1}
.sign small{font-size:13px;font-weight:500;opacity:.9}
.sign.a1{background:var(--sign);color:#fff}
.sign.a1 .badge{background:#fff;color:var(--sign-d)}
.sign.s2{background:repeating-linear-gradient(-45deg,var(--haz) 0 14px,var(--haz-d) 14px 28px);color:#111;border-color:var(--haz)}
.sign.s2 .txt{background:var(--haz);border-radius:6px;padding:4px 8px}
.sign.s2 .badge{background:var(--haz-d);color:var(--haz)}
.row2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sub{font-weight:700;font-size:13px;color:var(--muted);letter-spacing:.02em}
.btn{appearance:none;border:0;cursor:pointer;font-weight:900;font-size:18px;border-radius:14px;padding:14px 16px;color:var(--ink);background:var(--amber);box-shadow:0 5px 0 var(--amber-d);width:100%}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--amber-d)}
.btn.ghost{background:#3a2a1e;color:var(--paper);box-shadow:0 5px 0 #0c0806}
.btn.small{width:auto;flex:1;font-size:14px;padding:10px 8px;background:#3a2a1e;color:var(--paper);box-shadow:0 4px 0 #0c0806}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.stats{font-size:16px;line-height:1.65;margin:0;color:var(--muted);font-variant-numeric:tabular-nums}
.stats b{color:#fff}
#end{background:linear-gradient(180deg,rgba(21,17,13,.25) 0%,rgba(21,17,13,.75) 40%,rgba(21,17,13,.96) 70%)}
#pause{background:rgba(21,17,13,.82);justify-content:center}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);font-family:Bungee,Impact,sans-serif;font-size:18px;color:var(--muted)}
#loading[hidden]{display:none}
</style>
