  :root { color-scheme: dark; }
  html, body { margin: 0; background: #08090b; color: #e8ebee; font: 14px/1.4 Archivo, system-ui, sans-serif; }
  body.render { overflow: hidden; }
  body.render #ui { display: none; }
  body.render canvas { position: fixed; inset: 0; }
  #stage { display: grid; place-items: center; height: calc(100vh - 64px); padding: 12px; box-sizing: border-box; }
  #stage canvas { max-width: 100%; max-height: 100%; box-shadow: 0 20px 60px rgba(0,0,0,.6); background: #000; }
  #ui { display: flex; gap: 10px; align-items: center; height: 64px; padding: 0 16px; border-top: 1px solid #22262b; }
  #ui button { font: inherit; font-weight: 600; color: #e8ebee; background: #1a1d21; border: 1px solid #30353b; border-radius: 6px; padding: 8px 12px; cursor: pointer; }
  #ui button[aria-pressed="true"] { background: #c4302b; border-color: #c4302b; }
  #ui input[type=range] { flex: 1; accent-color: #ff3b2f; }
  #time { font-family: 'JetBrains Mono', monospace; min-width: 64px; text-align: right; }
</style>
</head>
<body>
<div id="stage"><canvas id="film"></canvas></div>
<div id="ui">
  <button id="play">▶ Odtwórz</button>
  <button data-fmt="16x9" aria-pressed="true">16:9</button>
  <button data-fmt="9x16" aria-pressed="false">9:16</button>
  <input id="scrub" type="range" min="0" max="13" step="0.001" value="0">
  <span id="time">0.00 s</span>
</div>
<script src="config.js"></script>
<script src="audio.js"></script>
<script src="film.js"></script>
<script>
(async () => {
  const q = new URLSearchParams(location.search);
  const render = q.has('render');
  const canvas = document.getElementById('film');
  const assets = JSON.parse(q.get('assets') || '{}');
  if (render) document.body.classList.add('render');

  async function setup(w, h) {
    await KWFilm.init({ canvas, width: w, height: h, assets });
    KWFilm.draw(t);
  }
  let t = Number(q.get('t') || 0);
  const fmt = q.get('fmt') || '16x9';
  const size = (f) => (f === '9x16' ? [1080, 1920] : [1920, 1080]);
  await setup(...size(fmt));
  window.FILM_READY = true;
  if (render) return;

  // Podgląd z dźwiękiem: soundtrack liczy się w przeglądarce tym samym kodem co w renderze.
  let ac, buf, srcNode, startAt = 0, playing = false;
  const scrub = document.getElementById('scrub'), time = document.getElementById('time'), play = document.getElementById('play');
  function show() { scrub.value = t; time.textContent = t.toFixed(2) + ' s'; KWFilm.draw(t); }
  function stop() { if (srcNode) { srcNode.onended = null; srcNode.stop(); srcNode = null; } playing = false; play.textContent = '▶ Odtwórz'; }
  async function start() {
    ac = ac || new AudioContext({ sampleRate: 48000 });
    if (!buf) {
      const a = KWAudio.render(48000);
      buf = ac.createBuffer(2, a.left.length, 48000); buf.copyToChannel(a.left, 0); buf.copyToChannel(a.right, 1);
    }
    if (t >= KWFilm.duration - 0.01) t = 0;
    srcNode = ac.createBufferSource(); srcNode.buffer = buf; srcNode.connect(ac.destination);
    srcNode.start(0, t); startAt = ac.currentTime - t; playing = true; play.textContent = '❚❚ Pauza';
    srcNode.onended = () => { playing = false; play.textContent = '▶ Odtwórz'; };
    const loop = () => { if (!playing) return; t = Math.min(KWFilm.duration, ac.currentTime - startAt); show(); requestAnimationFrame(loop); };
    loop();
  }
  play.onclick = () => (playing ? stop() : start());
  scrub.oninput = () => { stop(); t = Number(scrub.value); show(); };
  document.querySelectorAll('[data-fmt]').forEach((b) => (b.onclick = async () => {
    document.querySelectorAll('[data-fmt]').forEach((x) => x.setAttribute('aria-pressed', x === b));
    await setup(...size(b.dataset.fmt)); show();
  }));
  show();
})();
</script>
</body>
</html>
